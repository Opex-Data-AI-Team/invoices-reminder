name: remind
on:
  schedule:
    - cron: "0 8 * * 1-5" # 08:00 UTC = 09:00 Lagos, Mon-Fri
  workflow_dispatch:
    inputs:
      send:
        description: "1 = really send, 0 = dry run"
        default: "0"
      diagnose:
        description: "1 = print who gets what (counts and client names only), send nothing"
        default: "0"
      list_clients:
        description: "1 = list clients with unpaid or draft invoices (Clients tab); all = every client on any invoice (Client, Region, Rep sheet)"
        default: "0"
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_remind.py
      - run: python3 remind.py
        env:
          SEND: ${{ inputs.send || vars.SEND }} # repo variable SEND=1 turns on real sending
          LIST_CLIENTS: ${{ inputs.list_clients }}
          DIAGNOSE: ${{ inputs.diagnose }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }} # manual runs ignore the weekend rule
          ZOHO_ORGS: ${{ vars.ZOHO_ORGS }} # e.g. Regtech=894826960,OPEX Consulting=790222018
          REPS_SRC: ${{ secrets.REPS_SRC }}
          CLIENTS_SRC: ${{ secrets.CLIENTS_SRC }}
          FOLLOWUPS_SRC: ${{ secrets.FOLLOWUPS_SRC }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LINK_PAGE_URL: ${{ vars.LINK_PAGE_URL }} # optional: static tap page (page/); falls back to the Apps Script URL
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }} # optional: enables "Log update" links + run log
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
          DAILY_SEND_CAP: ${{ vars.DAILY_SEND_CAP }} # optional, default 400
